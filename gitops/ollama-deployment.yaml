apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-inference
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          # CPU-only serving: start the server, pull a small model into it, then
          # wait on the server process. No GPU node pool, no external API key.
          args:
            - |
              ollama serve &
              sleep 5
              ollama pull llama3.2:1b
              wait
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 5Gi
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: 8Gi
