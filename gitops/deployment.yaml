apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-app
  namespace: genai-demo
  labels:
    app: genai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-app
  template:
    metadata:
      labels:
        app: genai-app
    spec:
      containers:
        - name: genai-app
          # CI bumps the tag on every build.
          image: us-central1-docker.pkg.dev/gcp-argocd-demo/genai-demo/genai-app:e20ea7cd2e91141e823ed27c7fe231804e32c9b1
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.llm-inference.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2:1b"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
