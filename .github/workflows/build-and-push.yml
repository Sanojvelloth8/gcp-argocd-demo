name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  REGION: us-central1
  REPO: genai-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        id: build-app
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/genai-app:${{ github.sha }}"
          docker build -t "$IMAGE_URI" app/
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: build-frontend
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/genai-frontend:${{ github.sha }}"
          docker build -t "$IMAGE_URI" frontend/
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Bump image tags in gitops manifests
        run: |
          sed -i "s#image: .*genai-app:.*#image: ${{ steps.build-app.outputs.image_uri }}#" gitops/deployment.yaml
          sed -i "s#image: .*genai-frontend:.*#image: ${{ steps.build-frontend.outputs.image_uri }}#" gitops/frontend-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/deployment.yaml gitops/frontend-deployment.yaml
          git commit -m "deploy: ${{ github.sha }}"
          git push
